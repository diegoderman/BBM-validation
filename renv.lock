      "Authors@R": "c( person(given = \"Amanda\", family = \"Mejia\", email = \"mandy.mejia@gmail.com\", role = c(\"aut\", \"cre\")), person(given = \"Damon\", family = \"Pham\", email = \"damondpham@gmail.com\", role = c(\"aut\"), comment = c(ORCID = \"0000-0001-7563-4727\")), person(given = \"Nohelia\", family = \"Da Silva\", email = \"nohelia.dasilva@gmail.com\", role = c(\"ctb\")) )",
